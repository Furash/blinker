[package]
name = "blinker"
version = "0.1.0"
edition = "2021"
description = "BlinkerUI"

[lib]
name = "blinker_lib"
path = "src/lib.rs"

[[bin]]
name = "BlinkerUI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
